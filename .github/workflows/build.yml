# Compila a app para Windows (instalador) e Android (APK) e publica ambos
# numa "Release" do repositório. Lança-se à mão em Actions → build.
name: build
on:
  workflow_dispatch:

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build windows --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }}
      - name: Criar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\wolfcal.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: wolfcal-windows
          path: build/installer/WolfCal-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_* (ver README)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/app/upload.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - run: flutter build apk --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk WolfCal.apk
      - name: Confirmar a assinatura (não pode ser a de depuração)
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs WolfCal.apk | tee certs.txt
          if grep -q "Android Debug" certs.txt; then
            echo "::error::O APK ficou assinado com a chave de depuração."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wolfcal-android
          path: WolfCal.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$APP_VERSION" WolfCal-Setup.exe WolfCal.apk
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "WolfCal $APP_VERSION"
          --notes "Windows: correr WolfCal-Setup.exe (atualiza a versão instalada). Android: instalar WolfCal.apk."
